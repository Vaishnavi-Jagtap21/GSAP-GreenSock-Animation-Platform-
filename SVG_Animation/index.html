<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container that holds the SVG "string" -->
    <div id="string">

        <!-- SVG canvas (1000px × 200px) -->
        <svg width="1000" height="200" xmlns="http://www.w3.org/2000/svg">

            <!-- The actual curved line:
                 M 10 100  → starting point
                 Q 550 100 → control point (middle)
                 990 100   → end point
            -->
            <path 
                d="M 10 100 Q 550 100 990 100" 
                stroke="white" 
                fill="transparent" 
            />
        </svg>

    </div>

    <!-- GSAP Animation Library -->
    <script 
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" 
      crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>

    <!-- External JavaScript file where your GSAP animation logic is written -->
    <script src="script.js"></script> 
</body>
</html>
